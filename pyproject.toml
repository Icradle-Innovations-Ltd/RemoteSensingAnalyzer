[project]
name = "remote-sensing-analyzer"
version = "0.1.0"
description = "Remote Sensing Data Analyzer"
requires-python = ">=3.9,<3.10"
dependencies = [
    "anthropic>=0.50.0",
    "earthengine-api>=1.5.13",
    "folium>=0.19.5",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "openai>=1.76.2",
    "opencv-python>=4.11.0.86",
    "pillow>=11.2.1",
    "python-dotenv>=1.1.0",
    "rasterio>=1.4.3",
    "requests>=2.32.3",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "sentinelsat>=1.2.1",
    "streamlit>=1.45.0",
    "trafilatura>=2.0.0",
    "Cython>=3.0.0",
    "pyproj>=3.4.1",
]

[tool.poetry]
name = "remote-sensing-analyzer"
version = "0.1.0"
description = "Remote Sensing Data Analyzer"
authors = ["Icradle Innovations Ltd <info@icradle.com>"]

[tool.poetry.dependencies]
python = "3.9.*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
